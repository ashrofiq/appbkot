<style id="uiModern">
/* v1.5.31 — pemolesan tampilan (hanya gaya; tata letak dan fungsi tidak berubah) */
:root{--mx-ease:cubic-bezier(.2,.7,.2,1);--mx-shadow:0 1px 2px rgba(16,42,67,.05),0 6px 20px -8px rgba(16,42,67,.14);--mx-shadow-h:0 2px 4px rgba(16,42,67,.06),0 12px 28px -10px rgba(16,42,67,.2);--mx-line:rgba(16,42,67,.08)}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-family:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 500px at 85% -10%,#e3edff 0,rgba(227,237,255,0) 60%),#f3f6fb;letter-spacing:.005em}
body.dark{background:radial-gradient(1200px 500px at 85% -10%,#142238 0,rgba(20,34,56,0) 60%),#0e151e}
::selection{background:#1a73e833}
*{scrollbar-width:thin;scrollbar-color:#b8c6d6 transparent}
body.dark *{scrollbar-color:#35485b transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c3cfdc;border-radius:9px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#a3b3c5;background-clip:padding-box;border:2px solid transparent}::-webkit-scrollbar-track{background:transparent}
body.dark ::-webkit-scrollbar-thumb{background:#33465a;background-clip:padding-box;border:2px solid transparent}

/* Tombol */
button{border-radius:10px;transition:background-color .18s var(--mx-ease),box-shadow .18s var(--mx-ease),transform .12s var(--mx-ease),color .18s}
.btn{background:linear-gradient(180deg,#2b83f0,#1a6fdf);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 12px -4px rgba(26,115,232,.6)}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#2478e6,#145fc4);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 18px -6px rgba(26,115,232,.65);transform:translateY(-1px)}
.btn2{background:#eaf0f8;box-shadow:0 0 0 1px rgba(16,42,67,.05) inset}.btn2:hover:not(:disabled){background:#dde7f4;transform:translateY(-1px)}
.btn3{background:linear-gradient(180deg,#ee5a49,#dc3f2e);box-shadow:0 4px 12px -4px rgba(231,76,60,.55)}.btn3:hover{background:linear-gradient(180deg,#e64e3d,#c93626);transform:translateY(-1px)}
.btn4{background:linear-gradient(180deg,#31b96b,#209c55);box-shadow:0 4px 12px -4px rgba(39,174,96,.55)}.btn4:hover{background:linear-gradient(180deg,#2aae62,#1b8a4a);transform:translateY(-1px)}
.btn5{background:linear-gradient(180deg,#f5a623,#e68a0e);box-shadow:0 4px 12px -4px rgba(243,156,18,.55)}.btn5:hover{background:linear-gradient(180deg,#eb9b19,#d17a08);transform:translateY(-1px)}
.btn-sm{border-radius:8px}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,.tab:focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
body.dark .btn2{background:#1f2c3b;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset}body.dark .btn2:hover:not(:disabled){background:#2a3a4c}

/* Input */
input,select,textarea{border-radius:10px;border:1px solid #d5dfea;background:#fcfdff;transition:border-color .15s,box-shadow .15s,background-color .15s}
input:hover,select:hover,textarea:hover{border-color:#b9c9db}
input:focus,select:focus,textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 4px rgba(26,115,232,.14);background:#fff}
body.dark input,body.dark select,body.dark textarea{background:#101b26;border-color:#2b3b4d}
body.dark input:hover,body.dark select:hover,body.dark textarea:hover{border-color:#3a4f65}
body.dark input:focus,body.dark select:focus,body.dark textarea:focus{border-color:#5fa8f5;box-shadow:0 0 0 4px rgba(95,168,245,.16)}
label{letter-spacing:.01em}

/* Bilah atas */
.top{background:linear-gradient(90deg,#0b3a6b 0,#0f4c81 45%,#1560b8 100%);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 6px 22px -10px rgba(8,36,74,.55)}

.burger,#themeBtn,.zoomBtn{border-radius:10px;backdrop-filter:blur(6px)}

/* Sidebar */
.side{background:#fff;border-right:1px solid var(--mx-line)}
.side a{margin:1px 8px 1px 0;border-radius:0 12px 12px 0;transition:background-color .15s,color .15s,padding-left .15s var(--mx-ease)}
.side a:hover{background:#eef4fd;color:#1a5fc4}
.side a.on{background:linear-gradient(90deg,#e3eeff,#eef5ff);box-shadow:0 1px 6px -3px rgba(26,115,232,.35)}
.side .sec{letter-spacing:1.2px}
body.dark .side{background:#111b26;border-right-color:rgba(255,255,255,.06)}
body.dark .side a:hover{background:#1a2635;color:#8fc3ff}
body.dark .side a.on{background:linear-gradient(90deg,#183049,#16273a);box-shadow:none}
.side-logout button{border-radius:10px;transition:background-color .15s,transform .12s}

/* Kartu dan judul */
.card,.dash-card,.kelas-group,.tabs,.sc{border:1px solid var(--mx-line);box-shadow:var(--mx-shadow)}
.card{border-radius:16px}.dash-card{border-radius:14px}.kelas-group{border-radius:14px}
.card h2,.hd h2{letter-spacing:-.01em}
.card h2,.dash-card h2,.hd h2,.mh h3{color:#0c4274}
body.dark .card,body.dark .dash-card,body.dark .kelas-group,body.dark .tabs,body.dark .sc{border-color:rgba(255,255,255,.06);box-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.6)}
body.dark .card h2,body.dark .dash-card h2,body.dark .hd h2,body.dark .mh h3{color:#8cc0fa}

/* Kartu statistik */
.sc{border-radius:14px;border-left-width:4px;background:linear-gradient(180deg,#fff,#fafcff);transition:transform .18s var(--mx-ease),box-shadow .18s var(--mx-ease)}
.sc:hover{transform:translateY(-2px);box-shadow:var(--mx-shadow-h)}
.sc .n{letter-spacing:-.02em;background:linear-gradient(180deg,#0c4274,#1a6fdf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sc.g .n{background:linear-gradient(180deg,#14753f,#27ae60);-webkit-background-clip:text;background-clip:text}
.sc.r .n{background:linear-gradient(180deg,#a82a1c,#e74c3c);-webkit-background-clip:text;background-clip:text}

.sc.p .n{background:linear-gradient(180deg,#6b2c91,#9b59b6);-webkit-background-clip:text;background-clip:text}
.sc.b .n{background:linear-gradient(180deg,#1d5f8c,#2e8bd0);-webkit-background-clip:text;background-clip:text}

body.dark .sc .n{background:linear-gradient(180deg,#a9d0fb,#5fa8f5);-webkit-background-clip:text;background-clip:text}
body.dark .sc.g .n{background:linear-gradient(180deg,#8ee3b0,#3fcf7d);-webkit-background-clip:text;background-clip:text}
body.dark .sc.r .n{background:linear-gradient(180deg,#ffb3a9,#ff6f5f);-webkit-background-clip:text;background-clip:text}
body.dark .sc.y .n{background:linear-gradient(180deg,#ffd58a,#f5a623);-webkit-background-clip:text;background-clip:text}
body.dark .sc.p .n{background:linear-gradient(180deg,#d9b3ee,#b377d6);-webkit-background-clip:text;background-clip:text}
body.dark .sc.b .n{background:linear-gradient(180deg,#a5d3f2,#56a9e6);-webkit-background-clip:text;background-clip:text}
body.dark .sc.pk .n{background:linear-gradient(180deg,#ffb1d6,#f06aa8);-webkit-background-clip:text;background-clip:text}

/* Header dashboard */
.dash-head{background:linear-gradient(135deg,#0b3a6b 0,#1560b8 55%,#2f8cff 100%);border-radius:14px;box-shadow:0 10px 26px -12px rgba(21,96,184,.6),0 1px 0 rgba(255,255,255,.18) inset;position:relative;overflow:hidden}
.dash-head:after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
body.dark .dash-head{background:linear-gradient(135deg,#0b2038,#123e6e 60%,#1b5fae);box-shadow:0 10px 26px -14px rgba(0,0,0,.7)}

/* Tab */
.tabs{border-radius:14px}.tabs .tab{border-radius:10px;transition:background-color .15s,color .15s,box-shadow .15s}
.tabs .tab.on{background:linear-gradient(180deg,#2b83f0,#1a6fdf);box-shadow:0 6px 14px -6px rgba(26,115,232,.65)}
body.dark .tabs .tab.on{background:linear-gradient(180deg,#2b83f0,#1a6fdf)}

/* Tabel */
.tw{border-radius:14px;border:1px solid var(--mx-line);box-shadow:0 1px 2px rgba(16,42,67,.04)}
th{background:linear-gradient(180deg,#f7faff,#f0f5fb);color:#3d5168;letter-spacing:.5px}
td{border-bottom-color:#edf2f8}
tbody tr{transition:background-color .12s}
tbody tr:hover{background:#f4f9ff}
body.dark .tw{border-color:rgba(255,255,255,.07)}
body.dark th{background:linear-gradient(180deg,#1b2838,#172231);color:#a9bccf}
body.dark td{border-bottom-color:#1d2a38}
body.dark tbody tr:hover{background:#1a2736}

/* Tag, chip, filter */
.tag{letter-spacing:.2px;box-shadow:0 0 0 1px rgba(0,0,0,.04) inset}
.chip{border-radius:20px}
.fbar{border-radius:14px;background:linear-gradient(180deg,#f9fbfe,#f4f8fd);border-color:var(--mx-line)}
body.dark .fbar{background:#131e2a;border-color:rgba(255,255,255,.06)}
.gc{border-radius:12px;transition:box-shadow .18s,transform .18s var(--mx-ease)}.gc:hover{box-shadow:var(--mx-shadow);transform:translateY(-1px)}

/* Notifikasi */
.notif{border-radius:12px;box-shadow:0 1px 2px rgba(16,42,67,.04)}

/* Modal dan toast */
.ov{backdrop-filter:blur(5px) saturate(120%);-webkit-backdrop-filter:blur(5px) saturate(120%);background:rgba(10,24,40,.5)}
.modal{border-radius:20px;border:1px solid var(--mx-line);box-shadow:0 30px 80px -20px rgba(8,24,48,.55),0 2px 6px rgba(8,24,48,.08);animation:mxPop .22s var(--mx-ease)}
body.dark .modal{border-color:rgba(255,255,255,.08)}
.mh{border-bottom-color:var(--mx-line)}.mf{border-top-color:var(--mx-line)}
.mh .x{border-radius:10px;transition:background-color .15s,color .15s}.mh .x:hover{background:#eef2f7;color:#42566b}
body.dark .mh .x:hover{background:#243342;color:#cfdbe8}
.tst{border-radius:14px;backdrop-filter:blur(8px);box-shadow:0 14px 34px -12px rgba(0,0,0,.45);animation:mxSlide .26s var(--mx-ease)}
.tst.ok{background:linear-gradient(135deg,#2fb86b,#1f9a53)}.tst.er{background:linear-gradient(135deg,#ec5645,#d63a29)}.tst.inf{background:linear-gradient(135deg,#2b83f0,#1a6fdf)}
@keyframes mxPop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes mxSlide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#main>*{animation:mxFade .28s var(--mx-ease)}
@keyframes mxFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Tombol mengambang */
.jurnal-float{box-shadow:0 8px 20px -6px rgba(39,174,96,.6);background:linear-gradient(180deg,#31b96b,#209c55)}

/* Halaman masuk */
#login{background:radial-gradient(900px 500px at 15% 10%,rgba(79,172,254,.55),rgba(79,172,254,0) 60%),radial-gradient(800px 500px at 90% 95%,rgba(21,96,184,.7),rgba(21,96,184,0) 60%),linear-gradient(135deg,#0b3a6b,#1560b8 55%,#2f8cff)}
.lcard{border-radius:24px;box-shadow:0 40px 90px -30px rgba(3,20,48,.7),0 1px 0 rgba(255,255,255,.6) inset;animation:mxPop .4s var(--mx-ease)}
.lcard h1{letter-spacing:-.01em}
.lcard .logo{box-shadow:0 10px 26px -8px rgba(26,115,232,.45)}
.lhint{border-radius:10px}.err{border-radius:10px}

@media print{body{background:#fff!important}.card,.dash-card,.tw,.sc{box-shadow:none!important}#main>*{animation:none!important}}

function rcTampil(){
  var el=$("#rcTbl");if(!el||!$("#srcKelas"))return;if(!_rcOn){el.innerHTML='<div class="empty">Pilih filter, lalu klik <b>Tampilkan</b> untuk menampilkan data.</div>';var rs0=$("#rcStat");rs0&&(rs0.innerHTML="");_rcView=[];return}

    if(!q)return true;
    var r=x.r||{};

    var r=x.r;
    if(!r)return'<tr><td>'+(i+1)+'</td><td>'+esc(x.s.Kelas)+'</td><td>'+esc(x.s.NIS)+'</td><td><b>'+esc(x.s.Nama)+'</b></td><td colspan="4"><span class="tag tgray">Belum mengisi</span></td></tr>';
    var tag=r.Rencana==="Kerja"?"ty":r.Rencana==="Kuliah"?"tb":"tg";
    return'<tr><td>'+(i+1)+'</td><td>'+esc(x.s.Kelas)+'</td><td>'+esc(x.s.NIS)+'</td><td><b>'+esc(x.s.Nama)+'</b></td><td><span class="tag '+tag+'">'+esc(r.Rencana)+'</span></td><td>'+esc(rcPil(r.PT1,r.Jurusan1))+'</td><td>'+esc(rcPil(r.PT2,r.Jurusan2))+'</td><td>'+esc(r.Biaya||"-")+'</td></tr>';
  }).join("")+'</tbody></table></div>';
}

NRDB.rank=async function(me){ /* → [{smt:0..6,avg,rk,tk,rp,tp}] ; smt 0 = semua semester */

function nrRankHitung(nilai,sis,me){
  var by={};nilai.forEach(function(r){if(r.nilai==null)return;((by[r.nis]=by[r.nis]||{})[r.mapel]=by[r.nis][r.mapel]||{})[r.smt]=r.nilai});

  [0,1,2,3,4,5,6].forEach(function(s){
    var rows=sis.map(function(x){var v=by[x.NIS]||{},g=nrNilaiMapel(v,s===0?"all":s),a=[];Object.keys(v).forEach(function(m){var n=g(m);if(n!=null)a.push(n)});
      return{nis:x.NIS,kelas:x.Kelas,tg:nrTingkat(x.Kelas),avg:a.length?Math.round(a.reduce(function(p,c){return p+c},0)/a.length*100)/100:null}}).filter(function(x){return x.avg!=null});

    var k=rows.filter(function(x){return x.kelas===mine.kelas}),t=rows.filter(function(x){return x.tg===mine.tg});
    out.push({smt:s,avg:mine.avg,rk:k.filter(function(x){return x.avg>mine.avg}).length+1,tk:k.length,rp:t.filter(function(x){return x.avg>mine.avg}).length+1,tp:t.length})});

function nrHitung(){
  var by={},mp={};
  NR.nilai.forEach(function(r){if(r.nilai==null)return;((by[r.nis]=by[r.nis]||{})[r.mapel]=by[r.nis][r.mapel]||{})[r.smt]=r.nilai;mp[r.mapel]=1});

    var avg=a.length?Math.round(a.reduce(function(p,c){return p+c},0)/a.length*100)/100:null;

    Object.keys(g).forEach(function(k){var l=g[k].slice().sort(function(a,b){return b.avg-a.avg});l.forEach(function(r,i){r[f]=(i>0&&l[i-1].avg===r.avg)?l[i-1][f]:i+1;r["t"+f]=l.length})})}
  rank(function(r){return r.Kelas},"rk");rank(function(r){return r.tingkat},"rp");

      g("Alpa "+PR_ALPA+" hari sekolah berturut-turut",v.alpa)+g("Alpa "+PR_ALPA_BLN+" hari atau lebih bulan ini",v.alpaBln)+g("Terlambat "+PR_TELAT+"× atau lebih bulan ini",v.telat)+
      g("Bermasalah presensi/keterlambatan, belum dilayani BK semester ini",v.tanpa)+"</div>";
  };
})();

/* ===== grafik dan perhitungan nilai ===== */
function nilaiAvgSmt(raw){ /* raw={mapel:{smt:nilai}} -> [avg s1..s6] */
  return[1,2,3,4,5,6].map(function(s){var a=[];Object.keys(raw||{}).forEach(function(m){var x=raw[m]&&raw[m][s];if(x!=null&&!isNaN(x))a.push(+x)});return a.length?Math.round(a.reduce(function(p,c){return p+c},0)/a.length*100)/100:null});
}
function nilaiSvg(v,w,h){
  w=w||520;h=h||170;var pl=34,pr=14,pt=16,pb=26,pts=[];v.forEach(function(x,i){if(x!=null)pts.push([i,x])});
  if(!pts.length)return'<div class="empty">Belum ada nilai.</div>';
  var mn=Math.min.apply(null,pts.map(function(p){return p[1]})),mx=Math.max.apply(null,pts.map(function(p){return p[1]}));
  mn=Math.floor(mn-3);mx=Math.ceil(mx+3);if(mx-mn<8){mx+=4;mn-=4}
  var X=function(i){return pl+(w-pl-pr)*i/5},Y=function(x){return pt+(h-pt-pb)*(1-(x-mn)/(mx-mn))};
  var s='<svg viewBox="0 0 '+w+" "+h+'" style="width:100%;max-width:'+w+'px;height:auto;color:#5b6b7b" role="img" aria-label="Tren rata-rata nilai per semester">';
  for(var k=0;k<=3;k++){var yy=mn+(mx-mn)*k/3;s+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(yy)+'" y2="'+Y(yy)+'" stroke="currentColor" stroke-opacity=".15"/><text x="'+(pl-6)+'" y="'+(Y(yy)+4)+'" text-anchor="end" font-size="10" fill="currentColor">'+Math.round(yy)+"</text>"}
  for(var i=0;i<6;i++)s+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle" font-size="11" fill="currentColor">S'+(i+1)+"</text>";
  s+='<polyline fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(function(p){return X(p[0])+","+Y(p[1])}).join(" ")+'"/>';
  pts.forEach(function(p,j){var prev=j>0?pts[j-1][1]:null,down=prev!=null&&prev-p[1]>=5;s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4.5" fill="'+(down?"#e74c3c":"#1a73e8")+'" stroke="#fff" stroke-width="1.5"/><text x="'+X(p[0])+'" y="'+(Y(p[1])-9)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="'+(down?"#e74c3c":"currentColor")+'">'+p[1].toFixed(1)+"</text>"});
  return s+"</svg>";
}

/* ===== 4. Tren nilai & siswa nilai turun (Nilai Raport) ===== */
function nrTren(nis){
  var r=(NR.hasil||[]).filter(function(x){return String(x.NIS)===String(nis)})[0];if(!r){toast("Tampilkan data nilai terlebih dahulu","er");return}
  var av=nilaiAvgSmt(r.raw),mp=Object.keys(r.raw).sort(function(a,b){return nrUrutIdx(a)-nrUrutIdx(b)||a.localeCompare(b)});
  var h='<div style="background:linear-gradient(135deg,#0f4c81,#1a73e8);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:10px"><b style="font-size:16px">'+esc(r.Nama)+'</b><div style="font-size:12.5px;opacity:.9;margin-top:3px">NIS '+esc(r.NIS)+" • Kelas "+esc(r.Kelas)+"</div></div>";
  h+='<div class="card" style="padding:10px"><div class="small" style="font-weight:700;margin-bottom:4px">Rata-rata nilai per semester <span style="font-weight:400">(titik merah = turun ≥ 5 poin dari semester sebelumnya)</span></div>'+nilaiSvg(av)+"</div>";
  h+='<div class="tw"><table style="font-size:12px;min-width:auto"><thead><tr><th style="text-align:left">Mata pelajaran</th>'+[1,2,3,4,5,6].map(function(s){return'<th style="text-align:center">S'+s+"</th>"}).join("")+"</tr></thead><tbody>";
  mp.forEach(function(m){var o=r.raw[m]||{},pv=null;h+='<tr><td>'+esc(m)+"</td>"+[1,2,3,4,5,6].map(function(s){var x=o[s],c="";if(x!=null){if(pv!=null&&pv-x>=5)c=' style="text-align:center;color:#e74c3c;font-weight:700"';pv=x}return"<td"+(c||' style="text-align:center"')+">"+(x==null?"–":nrFmt(x))+"</td>"}).join("")+"</tr>"});
  h+='<tr style="font-weight:700"><td>Rata-rata</td>'+av.map(function(x){return'<td style="text-align:center">'+(x==null?"–":nrFmt(x))+"</td>"}).join("")+"</tr></tbody></table></div>";
  openModal("📈 Tren Nilai",h,'<button class="btn2" onclick="closeModal()">Tutup</button>',true);
}
function nrTurunBuka(){
  if(!NR.on||!NR.hasil||!NR.hasil.length){toast("Klik Tampilkan terlebih dahulu","er");return}
  openModal("📉 Siswa dengan Nilai Turun",'<div class="fbar"><div class="fg"><label>Turun minimal (poin rata-rata)</label><input type="number" id="nrTrMin" value="5" min="0" step="0.5" oninput="nrTurunRender()"></div><div class="fg"><label>Dibandingkan dengan</label><select id="nrTrMode" onchange="nrTurunRender()"><option value="last">Semester sebelumnya</option><option value="peak">Semester tertinggi sebelumnya</option></select></div></div><div id="nrTrOut"></div>','<button class="btn2" onclick="closeModal()">Tutup</button>',true);
  nrTurunRender();
}
function nrTurunRender(){
  var min=+(document.getElementById("nrTrMin")||{}).value||0,mode=(document.getElementById("nrTrMode")||{}).value||"last",out=document.getElementById("nrTrOut");if(!out)return;
  var L=[];
  nrFiltered().forEach(function(r){
    var av=nilaiAvgSmt(r.raw),idx=[];av.forEach(function(x,i){if(x!=null)idx.push(i)});
    if(idx.length<2)return;var li=idx[idx.length-1],last=av[li],bi,bv;
    if(mode==="peak"){bi=idx[0];bv=av[bi];idx.slice(0,-1).forEach(function(i){if(av[i]>bv){bv=av[i];bi=i}})}else{bi=idx[idx.length-2];bv=av[bi]}
    var d=Math.round((bv-last)*100)/100;if(d>=min&&d>0)L.push({r:r,bi:bi,bv:bv,li:li,lv:last,d:d});
  });
  L.sort(function(a,b){return b.d-a.d});
  out.innerHTML=L.length?'<div class="hint" style="margin-bottom:6px">'+L.length+' siswa (sesuai filter kelas/konfirmasi yang sedang dipilih)</div><div class="tw"><table style="font-size:12.5px;min-width:auto"><thead><tr><th>No</th><th style="text-align:left">Siswa</th><th>Kelas</th><th>Dari</th><th>Ke</th><th>Turun</th><th></th></tr></thead><tbody>'+L.map(function(o,i){return'<tr><td>'+(i+1)+'</td><td style="text-align:left"><b>'+esc(o.r.Nama)+'</b><div class="small">'+esc(o.r.NIS)+"</div></td><td>"+esc(o.r.Kelas)+"</td><td>S"+(o.bi+1)+": "+nrFmt(o.bv)+"</td><td>S"+(o.li+1)+": "+nrFmt(o.lv)+'</td><td style="color:#e74c3c;font-weight:700">−'+nrFmt(o.d)+'</td><td><button class="btn2 btn-sm" onclick="nrTren(\''+esc(o.r.NIS)+'\')">📈</button></td></tr>'}).join("")+"</tbody></table></div>":'<div class="empty">Tidak ada siswa yang nilainya turun sebesar itu.</div>';
}

/* ===== 2. Profil siswa satu halaman + cetak ===== */
var PF_DEF=RW_DEF.concat([{sh:"KonferensiKasus",lb:"Konferensi Kasus",ic:"🤝"},{sh:"AlihTanganKasus",lb:"Alih Tangan Kasus",ic:"🔄"}]),PF={};
function pfRaw(sh,r){
  var t="";
  if(sh==="Kehadiran")t=({S:"Sakit",I:"Izin",A:"Alpa"})[r.Status]||r.Status||"",r.Keterangan&&(t+=" — "+r.Keterangan);
  else if(sh==="Keterlambatan")t=(r.JamDatang?r.JamDatang+" — ":"")+(r.Alasan||"");
  else if(sh==="Perizinan")t=(r.Alasan||"")+(r.JamKeluar?" ("+r.JamKeluar+(r.JamKembali?"–"+r.JamKembali:"")+")":"");
  else if(sh==="KonselingIndividual")t=(r.JenisLayanan?r.JenisLayanan+": ":"")+(r.Masalah||"");
  else if(sh==="PanggilanOT"||sh==="KunjunganRumah")t=r.Masalah||"";
  else if(sh==="CatatanKasus")t=r.Deskripsi||"";
  else if(sh==="CatatanAnekdot")t=r.Catatan||"";
  else if(sh==="KonferensiKasus")t=(r.JudulKasus?r.JudulKasus+": ":"")+(r.Deskripsi||"");
  else if(sh==="AlihTanganKasus")t=(r.TujuanAlih?r.TujuanAlih+" — ":"")+(r.Alasan||"");
  else if(sh==="Prestasi")t=[r.NamaLomba,r.Tingkat,r.Juara].filter(Boolean).join(" — ")+(r.Tahun?" ("+r.Tahun+")":"");
  t=String(t||"").replace(/\s+/g," ").trim();
  if(r.TglTL&&!r.TLSelesai)t+=(t?" ":"")+"[🔔 tindak lanjut "+tgl(String(r.TglTL).slice(0,10))+"]";
  return t;
}
async function profilSiswa(nis){
  var s=(ST.siswa||[]).find(function(x){return String(x.NIS)===String(nis)});
  if(!s){toast("Data siswa tidak ditemukan","er");return}
  var tok=++_rwTok;
  openModal("🧾 Profil Siswa",'<div class="empty">Memuat profil…</div>','<button class="btn2" onclick="closeModal()">Tutup</button>',true);
  var res=await Promise.all(PF_DEF.map(function(d){return rwAmbil(d,nis)})),nil=null;
  try{if(typeof NRDB!=="undefined"){var nr=await NRDB.nilai([String(nis)]),raw={};nr.forEach(function(x){if(x.nilai==null)return;(raw[x.mapel]=raw[x.mapel]||{})[x.smt]=x.nilai});nil=Object.keys(raw).length?nilaiAvgSmt(raw):null}}catch(e){}
  if(tok!==_rwTok)return;
  var cnt={S:0,I:0,A:0},items=[];
  PF_DEF.forEach(function(d,i){res[i].forEach(function(r){
    if(d.sh==="Kehadiran"){if(cnt[r.Status]===void 0)return;cnt[r.Status]++}
    items.push({tgl:String(r.Tanggal||(r.Tahun?r.Tahun+"-01-01":"")).slice(0,10),sh:d.sh,ic:d.ic,lb:d.lb,txt:pfRaw(d.sh,r)});
  })});
  items.sort(function(a,b){return a.tgl<b.tgl?1:a.tgl>b.tgl?-1:0});
  var kel=(ST.gurubk||[]).filter(function(g){return String(g.KelasAmpu||"").split(",").map(function(x){return x.trim()}).indexOf(s.Kelas)>=0}).map(function(g){return g.Nama});
  var ct=function(sh){var i=PF_DEF.findIndex(function(d){return d.sh===sh});return i<0?0:res[i].length};
  PF={s:s,items:items,nil:nil,cnt:cnt,kel:kel,cat:"",lim:60,tot:{terlambat:ct("Keterlambatan"),izin:ct("Perizinan"),layanan:ct("KonselingIndividual")+ct("PanggilanOT")+ct("KunjunganRumah")+ct("CatatanKasus"),prestasi:ct("Prestasi")}};
  var cards=[["b",cnt.A,"Alpa"],["y",cnt.S,"Sakit"],["g",cnt.I,"Izin (presensi)"],["r",PF.tot.terlambat,"Terlambat"],["p",PF.tot.layanan,"Layanan BK"],["g",PF.tot.prestasi,"Prestasi"]];
  var h='<div style="background:linear-gradient(135deg,#0f4c81,#1a73e8);color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:10px"><div style="font-size:18px;font-weight:800;line-height:1.2">'+esc(s.Nama||"-")+'</div><div style="font-size:12.5px;opacity:.92;margin-top:4px">NIS <b>'+esc(String(s.NIS))+"</b>"+(s.NISN?" • NISN <b>"+esc(s.NISN)+"</b>":"")+" • Kelas <b>"+esc(s.Kelas||"-")+"</b>"+(kel.length?" • Guru BK <b>"+esc(kel.join(", "))+"</b>":"")+"</div></div>";
  h+='<div class="stat">'+cards.map(function(c){return'<div class="sc '+c[0]+'"><div class="n">'+c[1]+'</div><div class="l">'+esc(c[2])+"</div></div>"}).join("")+"</div>";
  if(nil)h+='<div class="card" style="padding:10px"><div class="small" style="font-weight:700;margin-bottom:4px">📘 Rata-rata Nilai Raport per Semester</div>'+nilaiSvg(nil)+"</div>";
  h+='<div class="card" style="padding:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><b>🕒 Riwayat (terbaru di atas)</b><div id="pfChips" style="display:flex;gap:6px;flex-wrap:wrap"></div></div><div id="pfList"></div></div>';
  openModal("🧾 Profil Siswa",h,'<button class="btn4" onclick="pfCetak()">🖨 Cetak</button><button class="btn2" onclick="riwayatSiswa(\''+esc(String(s.NIS))+'\')">Riwayat per Jenis</button><button class="btn2" onclick="closeModal()">Tutup</button>',true);
  pfRender();
}
function pfRender(){
  var chips=document.getElementById("pfChips"),el=document.getElementById("pfList");if(!el||!PF.items)return;
  var jml={};PF.items.forEach(function(x){jml[x.sh]=(jml[x.sh]||0)+1});
  chips.innerHTML='<button class="'+(PF.cat===""?"btn":"btn2")+' btn-sm" onclick="pfCat(\'\')">Semua ('+PF.items.length+")</button>"+PF_DEF.filter(function(d){return jml[d.sh]}).map(function(d){return'<button class="'+(PF.cat===d.sh?"btn":"btn2")+' btn-sm" onclick="pfCat(\''+d.sh+'\')" title="'+esc(d.lb)+'">'+d.ic+" "+jml[d.sh]+"</button>"}).join("");

  el.innerHTML=L.slice(0,PF.lim).map(function(x){var t=x.txt.length>200?x.txt.slice(0,200)+"…":x.txt;return'<div class="rw-r"><b>'+(x.tgl?esc(tgl(x.tgl)):"—")+"</b> <span title=\""+esc(x.lb)+'">'+x.ic+"</span> "+(esc(t)||'<span style="opacity:.6">—</span>')+"</div>"}).join("")+(L.length>PF.lim?'<div style="text-align:center;margin-top:8px"><button class="btn2 btn-sm" onclick="PF.lim+=100;pfRender()">Tampilkan lebih banyak ('+(L.length-PF.lim)+")</button></div>":"");
}
function pfCat(c){PF.cat=c;PF.lim=60;pfRender()}

  var d='<!doctype html><html><head><meta charset="utf-8"><title>Profil Siswa — '+esc(s.Nama||"")+'</title><style>body{font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#111;margin:18px}h2{margin:4px 0 2px;font-size:17px;text-align:center}h3{margin:16px 0 6px;font-size:13px;border-bottom:1px solid #999;padding-bottom:3px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:4px 6px;vertical-align:top;text-align:left}th{background:#eee}.id td{border:none;padding:2px 6px}.sum{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.sum div{border:1px solid #888;border-radius:6px;padding:4px 10px;text-align:center}.sum b{display:block;font-size:15px}svg{max-width:100%}@media print{@page{margin:14mm}}</style></head><body>'+kop+"<h2>PROFIL SISWA</h2><div style='text-align:center;margin-bottom:8px'>Layanan Bimbingan dan Konseling</div>"+
   "<table class='id'><tr><td width='110'>Nama</td><td>: <b>"+esc(s.Nama||"")+"</b></td><td width='90'>NIS</td><td>: "+esc(String(s.NIS))+"</td></tr><tr><td>Kelas</td><td>: "+esc(s.Kelas||"")+"</td><td>NISN</td><td>: "+esc(s.NISN||"-")+"</td></tr><tr><td>Guru BK</td><td colspan='3'>: "+esc(PF.kel.join(", ")||"-")+"</td></tr></table>"+
   "<div class='sum'><div><b>"+PF.cnt.A+"</b>Alpa</div><div><b>"+PF.cnt.S+"</b>Sakit</div><div><b>"+PF.cnt.I+"</b>Izin</div><div><b>"+PF.tot.terlambat+"</b>Terlambat</div><div><b>"+PF.tot.layanan+"</b>Layanan BK</div><div><b>"+PF.tot.prestasi+"</b>Prestasi</div></div>"+nilai+
   "<h3>Riwayat Kegiatan dan Catatan</h3><table><tr><th width='80'>Tanggal</th><th width='150'>Jenis</th><th>Keterangan</th></tr>"+rows+"</table><p style='margin-top:14px;font-size:10.5px;color:#555'>Dicetak: "+esc(tgl(today()))+" — Aplikasi Layanan BK. Dokumen ini bersifat rahasia.</p></body></html>";
  var w=window.open("","_blank");if(!w){toast("Pop-up diblokir. Izinkan pop-up untuk mencetak.","er");return}
  w.document.write(d);w.document.close();setTimeout(function(){try{w.focus();w.print()}catch(e){}},400);
}
