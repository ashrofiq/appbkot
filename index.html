<script>var TOPIK_PENGGUNA=["muksin"],TOPIK_BK={kelompok:{XI:[["Mengenali potensi diri sebagai fondasi arah karir.","Siswa mampu mengenali minat, bakat, dan kekuatan dirinya sebagai dasar menentukan arah karir.","Siswa memahami gambaran potensi dirinya dan mengaitkannya dengan pilihan studi atau karir yang sesuai.","Siswa terdorong menggali kelebihan dan hal yang perlu dikembangkan untuk merencanakan karir."],["Memilih jurusan/karir dari hati, bukan ikut-ikutan teman atau tren.","Siswa mampu memilih jurusan atau karir berdasarkan minat dan kemampuan sendiri, bukan pengaruh teman.","Siswa menyadari risiko ikut-ikutan tren dan berani mengambil keputusan karir yang mandiri.","Siswa memiliki pertimbangan matang dalam memilih jurusan sesuai kata hati dan potensinya."],["Menyeimbangkan akademik, organisasi, dan persiapan masa depan.","Siswa mampu membagi waktu secara seimbang antara belajar, organisasi, dan persiapan masa depan.","Siswa memahami pentingnya prioritas agar prestasi akademik dan kegiatan organisasi tetap terjaga.","Siswa terlatih menyusun jadwal yang menyeimbangkan tugas sekolah, organisasi, dan rencana setelah lulus."],["Mengenali profesi baru dan skill yang tidak tergeser teknologi.","Siswa mengenal profesi-profesi baru yang muncul seiring perkembangan teknologi.","Siswa memahami keterampilan yang tetap dibutuhkan meski teknologi berkembang pesat.","Siswa termotivasi mengembangkan skill masa depan agar siap bersaing di dunia kerja."],["Membuka wawasan jalur karir langsung kerja dan wirausaha.","Siswa memahami jalur karir langsung bekerja dan berwirausaha sebagai pilihan setelah lulus.","Siswa mengetahui peluang, tantangan, dan persiapan yang dibutuhkan untuk bekerja atau berwirausaha.","Siswa terbuka wawasannya bahwa sukses tidak hanya melalui kuliah, tetapi juga lewat kerja dan usaha."]],XII:[["Menyelaraskan perbedaan pilihan karir dengan orang tua secara asertif.","Siswa mampu mengomunikasikan pilihan karirnya kepada orang tua secara asertif dan santun.","Siswa memahami cara menyelaraskan perbedaan pendapat dengan orang tua tanpa menimbulkan konflik.","Siswa terlatih menyampaikan alasan pilihan karir dan menerima masukan orang tua dengan terbuka."],["Mengelola kecemasan menghadapi ujian kelulusan dan masa depan.","Siswa mampu mengelola rasa cemas menghadapi ujian kelulusan dan ketidakpastian masa depan.","Siswa mengenal cara sehat untuk mengurangi kecemasan dan menjaga semangat belajar.","Siswa memiliki strategi menenangkan diri serta berpikir positif menjelang ujian dan kelulusan."],["Menyiapkan rencana cadangan (Plan B) jika tidak lolos pilihan utama.","Siswa mampu menyusun rencana cadangan (Plan B) apabila tidak lolos pilihan utama.","Siswa menyadari pentingnya alternatif pilihan studi atau karir agar tidak mudah putus asa.","Siswa memiliki beberapa opsi masa depan yang realistis serta sikap lapang menghadapi hasil seleksi."],["Pembekalan etika, mental, dan langkah cepat masuk dunia kerja.","Siswa memahami etika dan kesiapan mental yang dibutuhkan untuk memasuki dunia kerja.","Siswa mengetahui langkah cepat mencari dan melamar pekerjaan setelah lulus.","Siswa siap secara mental dan bersikap profesional dalam menghadapi dunia kerja."],["Menganalisis peluang masuk PTN berdasarkan data dan nilai rapor.","Siswa mampu menganalisis peluang masuk PTN berdasarkan data dan nilai rapornya.","Siswa memahami cara menyesuaikan pilihan program studi dengan capaian nilai rapor secara realistis.","Siswa terbantu menentukan pilihan PTN dan prodi yang peluangnya sesuai dengan datanya."]]},klasikal:{XI:[["Memahami beda PTN, PTS, Kedinasan, TNI/Polri, dan Dunia Kerja.","Siswa memahami perbedaan PTN, PTS, sekolah kedinasan, TNI/Polri, dan dunia kerja.","Siswa mengetahui karakteristik, jalur masuk, dan persyaratan tiap pilihan lanjutan setelah SMA.","Siswa mampu membandingkan berbagai pilihan setelah lulus sesuai minat dan kemampuannya."],["Mengasah komunikasi, kerja sama, dan pemecahan masalah.","Siswa terlatih berkomunikasi efektif, bekerja sama, dan memecahkan masalah dalam kelompok.","Siswa menyadari pentingnya soft skill komunikasi dan kerja sama untuk studi maupun karir.","Siswa mampu menerapkan langkah pemecahan masalah melalui aktivitas bersama."],["Mengikis persepsi keliru tentang jurusan dan prospek kerjanya.","Siswa terhindar dari persepsi keliru tentang jurusan dan prospek kerjanya.","Siswa memahami bahwa prospek kerja suatu jurusan perlu dilihat dari informasi yang benar.","Siswa mampu mencari informasi jurusan yang akurat sebelum menentukan pilihan."],["Mengumpulkan rekam jejak prestasi dan kegiatan untuk portofolio.","Siswa mampu mengumpulkan dan mendokumentasikan prestasi serta kegiatannya sebagai portofolio.","Siswa memahami manfaat portofolio untuk seleksi masuk perguruan tinggi dan dunia kerja.","Siswa termotivasi menambah prestasi dan menata rekam jejaknya secara rapi."],["Memahami estimasi biaya studi lanjut dan perencanaan keuangan.","Siswa memahami perkiraan biaya studi lanjut dan pentingnya perencanaan keuangan.","Siswa mengetahui sumber pembiayaan seperti beasiswa dan tabungan pendidikan.","Siswa mampu menyusun gambaran sederhana kebutuhan biaya kuliah dan cara memenuhinya."]],XII:[["Strategi dan linimasa teknis SNBP, SNBT, serta Seleksi Mandiri.","Siswa memahami strategi dan linimasa teknis SNBP, SNBT, dan Seleksi Mandiri.","Siswa mengetahui syarat, tahapan, dan jadwal tiap jalur seleksi masuk perguruan tinggi.","Siswa mampu menyusun strategi memilih jalur seleksi yang sesuai dengan kondisinya."],["Panduan praktis syarat dan pendaftaran beasiswa (KIP-K & Swasta).","Siswa memahami syarat dan alur pendaftaran beasiswa KIP-K maupun beasiswa swasta.","Siswa mengetahui dokumen dan langkah praktis yang perlu disiapkan untuk mendaftar beasiswa.","Siswa termotivasi mengajukan beasiswa dengan persiapan yang tepat."],["Membuat CV standar profesional untuk lamaran kerja atau kampus.","Siswa mampu membuat CV standar profesional untuk melamar kerja atau mendaftar kampus.","Siswa memahami bagian-bagian CV dan cara menyajikan kelebihan diri secara jujur dan menarik.","Siswa terlatih menyusun CV yang rapi, ringkas, dan sesuai tujuan."],["Latihan teknik menjawab wawancara kerja, beasiswa, dan kampus.","Siswa terlatih menjawab pertanyaan wawancara kerja, beasiswa, dan kampus dengan percaya diri.","Siswa memahami teknik memperkenalkan diri dan menjawab pertanyaan wawancara secara jelas.","Siswa mampu berlatih simulasi wawancara dan mengevaluasi jawabannya."],["Adaptasi kehidupan mandiri (adulting), merantau, dan kontrol diri.","Siswa siap beradaptasi dengan kehidupan mandiri, merantau, dan mengendalikan diri.","Siswa memahami keterampilan dasar adulting seperti mengatur keuangan, waktu, dan kebutuhan sehari-hari.","Siswa mampu menjaga kontrol diri dan tanggung jawab saat hidup jauh dari orang tua."]]}},TOPIK_HASIL=["Anggota kelompok aktif berdiskusi tentang {t}, menyampaikan pandangan dan pengalaman masing-masing dengan terbuka. Suasana kelompok kondusif.","Melalui dinamika kelompok, anggota memperoleh pemahaman baru tentang {t} dan merumuskan langkah sederhana yang akan dilakukan setelah kegiatan.","Anggota antusias, saling memberi masukan terkait {t}, dan menyatakan kegiatan bermanfaat. Tindak lanjut: pemantauan dan konseling lanjutan bila diperlukan."],TOPIK_CATATAN=["Kegiatan berjalan lancar dan siswa mengikuti materi tentang {t} dengan antusias. Beberapa siswa aktif bertanya dan menanggapi.","Siswa memahami materi tentang {t} melalui diskusi dan tanya jawab. Siswa yang membutuhkan bimbingan lanjutan akan ditindaklanjuti melalui layanan konseling.","Pelaksanaan layanan kondusif; mayoritas siswa terlibat aktif dalam pembahasan {t}. Evaluasi dilakukan melalui refleksi singkat di akhir sesi."],TOPIK_METODE=["Diskusi Kelompok","Ceramah","Studi Kasus"],TOPIK_MEDIA=["Slide presentasi (PPT) dan LCD proyektor","Video / tayangan inspiratif","Lembar kerja siswa"];TOPIK_BK.konseling={ALL:[["Kesulitan belajar dan prestasi menurun.","Membantu siswa mengenali penyebab menurunnya prestasi dan menemukan cara belajar yang sesuai.","Membantu siswa mengatasi kesulitan memahami pelajaran dan menyusun strategi belajar yang efektif.","Membantu siswa bangkit dari penurunan nilai dan menetapkan target belajar yang realistis."],["Malas belajar dan kurang motivasi.","Membantu siswa menemukan kembali semangat dan alasan untuk belajar.","Membantu siswa mengatasi rasa malas dengan menetapkan tujuan kecil yang mudah dicapai.","Meningkatkan motivasi belajar siswa melalui penguatan potensi dan cita-citanya."],["Sering terlambat datang ke sekolah.","Membantu siswa mengenali penyebab keterlambatan dan menyusun langkah agar datang tepat waktu.","Menumbuhkan kesadaran siswa akan disiplin waktu dan dampak keterlambatan bagi belajarnya.","Membantu siswa mengatur rutinitas pagi agar tidak terlambat lagi."],["Sering tidak masuk sekolah atau membolos.","Menggali alasan siswa tidak masuk sekolah dan menumbuhkan komitmen untuk hadir.","Membantu siswa memahami akibat ketidakhadiran dan mencari solusi atas hambatannya.","Menumbuhkan kembali kenyamanan dan tanggung jawab siswa untuk hadir di sekolah."],["Kesulitan bergaul dan konflik dengan teman.","Membantu siswa membangun keterampilan sosial dan menjalin hubungan yang sehat dengan teman.","Membantu siswa menyelesaikan konflik dengan teman secara baik dan saling menghargai.","Melatih siswa berkomunikasi asertif agar mudah diterima dalam pergaulan."],["Menjadi korban atau pelaku perundungan (bullying).","Melindungi siswa dari perundungan dan memulihkan rasa aman di lingkungan sekolah.","Menumbuhkan empati dan kesadaran siswa tentang dampak perundungan bagi orang lain.","Membantu siswa menyikapi perundungan dan mengetahui langkah mencari bantuan."],["Konflik dengan orang tua atau masalah keluarga.","Membantu siswa mengelola perasaan dan memahami situasi keluarganya secara positif.","Membantu siswa mengomunikasikan kebutuhannya kepada orang tua dengan santun.","Menguatkan siswa agar tetap fokus belajar meski menghadapi masalah di rumah."],["Kecanduan gawai, media sosial, atau game online.","Menyadarkan siswa akan dampak penggunaan gawai berlebihan dan membantu membatasinya.","Membantu siswa mengatur waktu bermain gawai agar tidak mengganggu belajar.","Membantu siswa menemukan kegiatan positif pengganti penggunaan gawai berlebihan."],["Kecemasan dan stres menghadapi tuntutan belajar.","Membantu siswa mengelola kecemasan dan stres akademik secara sehat.","Melatih siswa teknik relaksasi dan berpikir positif saat menghadapi tekanan belajar.","Membantu siswa mengatur beban belajar agar lebih tenang dan percaya diri."],["Rendah diri dan kurang percaya diri.","Membantu siswa mengenali kelebihan dirinya dan menumbuhkan rasa percaya diri.","Membantu siswa mengubah pikiran negatif tentang diri menjadi lebih positif.","Melatih siswa berani tampil dan mengemukakan pendapat."],["Kebingungan memilih jurusan atau karir.","Membantu siswa mengenali minat dan potensi untuk menentukan pilihan jurusan atau karir.","Membantu siswa mengumpulkan informasi dan mempertimbangkan pilihan studi lanjut.","Membantu siswa membuat keputusan karir yang sesuai dengan dirinya."],["Masalah pergaulan lawan jenis atau pacaran.","Membantu siswa memahami batasan pergaulan lawan jenis yang sehat dan bertanggung jawab.","Membantu siswa mengelola perasaan dan menjaga fokus belajar dalam hubungan pertemanan.","Menumbuhkan kesadaran siswa tentang norma dan risiko dalam pacaran."],["Pelanggaran tata tertib dan kedisiplinan.","Menumbuhkan kesadaran siswa akan tata tertib dan konsekuensi pelanggarannya.","Membantu siswa memahami penyebab perilakunya dan berkomitmen memperbaikinya.","Membimbing siswa mengembangkan sikap disiplin dan tanggung jawab."],["Kesulitan ekonomi dan biaya sekolah.","Membantu siswa tetap semangat belajar dan mengetahui bantuan pendidikan yang tersedia.","Membantu siswa mencari solusi atas kendala biaya sekolah bersama pihak terkait.","Menguatkan siswa menghadapi keterbatasan ekonomi tanpa kehilangan motivasi belajar."],["Kesulitan mengatur waktu dan menunda tugas.","Membantu siswa menyusun jadwal belajar dan kegiatan yang seimbang.","Membantu siswa mengatasi kebiasaan menunda tugas dengan skala prioritas.","Melatih siswa mengelola waktu agar tugas selesai tepat waktu."]]},TOPIK_BK.konseling.ALL.push.apply(TOPIK_BK.konseling.ALL,[["Sering izin keluar sekolah pada jam pelajaran.","Membantu siswa memahami alasan sering izin keluar dan dampaknya bagi kegiatan belajar.","Menumbuhkan tanggung jawab siswa agar izin keluar hanya untuk keperluan yang mendesak.","Membantu siswa mencari solusi atas kebutuhan yang membuatnya sering keluar sekolah."],["Sering sakit dan tidak masuk sekolah.","Menggali penyebab siswa sering sakit dan membantu menjaga kondisi agar tetap mengikuti pembelajaran.","Membantu siswa mengejar ketertinggalan pelajaran akibat sering tidak masuk karena sakit.","Menumbuhkan perhatian siswa dan keluarga pada pola hidup sehat serta komunikasi dengan sekolah."],["Sering izin tidak masuk sekolah.","Menggali alasan siswa sering izin tidak masuk dan menumbuhkan komitmen untuk hadir.","Membantu siswa memahami dampak seringnya izin terhadap capaian belajar.","Membantu siswa dan orang tua mencari solusi agar kehadiran di sekolah meningkat."]]);var TOPIK_KPEND=["Pendekatan person-centered dengan teknik refleksi perasaan dan empati","Konseling realitas (WDEP) dengan teknik pertanyaan terarah","Pendekatan kognitif-perilaku dengan teknik restrukturisasi pikiran dan tugas rumah"],TOPIK_KHASIL=["Siswa terbuka menceritakan masalah tentang {t}, mulai menyadari penyebabnya, dan bersedia mencoba langkah penyelesaian yang disepakati.","Siswa memahami permasalahan tentang {t} dan menyusun komitmen sederhana untuk memperbaikinya. Siswa tampak lebih tenang dan termotivasi.","Siswa mampu mengidentifikasi hambatan terkait {t} serta memilih alternatif solusi yang sesuai dengan kemampuannya."],TOPIK_KRENC=["Memantau perkembangan siswa dalam 1\u20132 minggu dan melakukan konseling lanjutan bila diperlukan.","Berkoordinasi dengan wali kelas atau orang tua bila diperlukan dan menjadwalkan pertemuan evaluasi.","Siswa melaksanakan komitmen yang disepakati; guru BK melakukan tindak lanjut dan evaluasi pada pertemuan berikutnya."];TOPIK_BK.kelompok.XI.push.apply(TOPIK_BK.kelompok.XI,[["Mengenal dunia kerja dan bidang pekerjaan yang sesuai dengan minat.","Siswa mengenal berbagai bidang pekerjaan dan mampu menghubungkannya dengan minat dirinya.","Siswa memahami gambaran dunia kerja, tuntutan keterampilan, dan peluang di tiap bidang.","Siswa terbantu menyempitkan pilihan bidang pekerjaan yang sesuai dengan minat dan kemampuannya."],["Mengenali tipe kepribadian dan minat karir untuk menentukan pilihan studi.","Siswa mengenali tipe kepribadian dan minat karirnya sebagai dasar memilih program studi.","Siswa memahami kecocokan antara tipe kepribadian, minat, dan rumpun pekerjaan.","Siswa mampu mengaitkan hasil pengenalan diri dengan pilihan jurusan dan karir."],["Menyusun rencana karir jangka pendek dan jangka panjang.","Siswa mampu menyusun rencana karir jangka pendek dan jangka panjang secara sederhana.","Siswa memahami langkah bertahap yang perlu ditempuh untuk mencapai cita-cita karirnya.","Siswa terlatih menetapkan tujuan karir yang spesifik, terukur, dan realistis."],["Menggali informasi karir dari alumni dan tokoh inspiratif.","Siswa memperoleh gambaran nyata tentang perjalanan karir melalui pengalaman alumni dan tokoh inspiratif.","Siswa termotivasi mengejar cita-cita setelah mengetahui kiat dan tantangan dalam meniti karir.","Siswa mampu menggali informasi karir dengan bertanya dan mengambil pelajaran dari pengalaman orang lain."],["Mengembangkan keterampilan abad 21 untuk kesiapan karir.","Siswa memahami keterampilan abad 21 seperti berpikir kritis, kreativitas, kolaborasi, dan komunikasi.","Siswa mampu menilai keterampilan yang sudah dimiliki dan yang perlu dikembangkan untuk karirnya.","Siswa terdorong melatih keterampilan abad 21
