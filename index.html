alah.", "Siswa terlatih berkomunikasi efektif, bekerja sama, dan memecahkan masalah dalam kelompok.", "Siswa menyadari pentingnya soft skill komunikasi dan kerja sama untuk studi maupun karir.", "Siswa mampu menerapkan langkah pemecahan masalah melalui aktivitas bersama."], ["Mengikis persepsi keliru tentang jurusan dan prospek kerjanya.", "Siswa terhindar dari persepsi keliru tentang jurusan dan prospek kerjanya.", "Siswa memahami bahwa prospek kerja suatu jurusan perlu dilihat dari informasi yang benar.", "Siswa mampu mencari informasi jurusan yang akurat sebelum menentukan pilihan."], ["Mengumpulkan rekam jejak prestasi dan kegiatan untuk portofolio.", "Siswa mampu mengumpulkan dan mendokumentasikan prestasi serta kegiatannya sebagai portofolio.", "Siswa memahami manfaat portofolio untuk seleksi masuk perguruan tinggi dan dunia kerja.", "Siswa termotivasi menambah prestasi dan menata rekam jejaknya secara rapi."], ["Memahami estimasi biaya studi lanjut dan perencanaan keuangan.", "Siswa memahami perkiraan biaya studi lanjut dan pentingnya perencanaan keuangan.", "Siswa mengetahui sumber pembiayaan seperti beasiswa dan tabungan pendidikan.", "Siswa mampu menyusun gambaran sederhana kebutuhan biaya kuliah dan cara memenuhinya."]], "XII": [["Strategi dan linimasa teknis SNBP, SNBT, serta Seleksi Mandiri.", "Siswa memahami strategi dan linimasa teknis SNBP, SNBT, dan Seleksi Mandiri.", "Siswa mengetahui syarat, tahapan, dan jadwal tiap jalur seleksi masuk perguruan tinggi.", "Siswa mampu menyusun strategi memilih jalur seleksi yang sesuai dengan kondisinya."], ["Panduan praktis syarat dan pendaftaran beasiswa (KIP-K & Swasta).", "Siswa memahami syarat dan alur pendaftaran beasiswa KIP-K maupun beasiswa swasta.", "Siswa mengetahui dokumen dan langkah praktis yang perlu disiapkan untuk mendaftar beasiswa.", "Siswa termotivasi mengajukan beasiswa dengan persiapan yang tepat."], ["Membuat CV standar profesional untuk lamaran kerja atau kampus.", "Siswa mampu membuat CV s
